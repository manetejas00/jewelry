<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102124">
  <title>Offline · Veyora Jewels</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f6f0; color: #182c2c; font-family: Georgia, "Times New Roman", serif; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
    main { max-width: 34rem; }
    p, a { font-family: "Segoe UI", sans-serif; }
    h1 { font-weight: 400; font-size: 2.4rem; line-height: 1.1; margin: 0 0 0.6rem; }
    p { font-size: 1rem; line-height: 1.6; }
    a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 0.5rem; padding: 0 1.1rem; background: #102124; color: #f8f6f0; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/logo.webp" width="180" height="120" alt="Veyora Jewels" style="object-fit:contain"/>
    <h1>You are offline.</h1>
    <p>The catalogue, prices, stock, sign-in, and checkout need a connection. Nothing here was saved for offline shopping, so you will not see an old price or an old bag.</p>
    <p><a href="/">Try again</a></p>
  </main>

</html>
