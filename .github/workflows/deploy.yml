name: Deploy main
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p 65002 82.112.239.95 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hostinger -p 65002 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            u382139760@82.112.239.95 "bash -s -- ${GITHUB_SHA}" < scripts/hostinger-deploy.sh
